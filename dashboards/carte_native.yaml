# Version 100 % native (aucun HTML) : la plus compatible, s'adapte toute seule.
# Bleu = Heure Creuse, Rouge = Heure Pleine
type: vertical-stack
cards:
  - type: conditional
    conditions:
      - condition: state
        entity: binary_sensor.heures_creuses_heure_creuse
        state: "on"
    card:
      type: tile
      entity: sensor.heures_creuses_periode
      name: Tarif actuel
      icon: mdi:weather-night
      color: blue
      state_content:
        - state
        - prix
  - type: conditional
    conditions:
      - condition: state
        entity: binary_sensor.heures_creuses_heure_creuse
        state: "off"
    card:
      type: tile
      entity: sensor.heures_creuses_periode
      name: Tarif actuel
      icon: mdi:flash
      color: red
      state_content:
        - state
        - prix
  - type: grid
    columns: 2
    square: false
    cards:
      - type: tile
        entity: sensor.heures_creuses_prochain_changement
        name: Prochain changement
      - type: tile
        entity: sensor.heures_creuses_saison
        name: Saison
