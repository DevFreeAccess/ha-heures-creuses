# Carte colorée « façon Tempo » — s'adapte du téléphone à la grande tablette
# Bleu = Heure Creuse, Rouge = Heure Pleine
type: markdown
content: |-
  {% set hc = is_state('binary_sensor.heures_creuses_heure_creuse', 'on') %}
  {% set prix = states('sensor.heures_creuses_prix_actuel') | float(0) %}
  {% set saison = states('sensor.heures_creuses_saison') %}
  {% set heure = state_attr('sensor.heures_creuses_periode', 'heure_prochain_changement') %}
  {% set prochaine = state_attr('sensor.heures_creuses_periode', 'prochaine_periode') %}
  {% set reste = states('sensor.heures_creuses_temps_restant') | int(0) %}
  <div style="box-sizing:border-box;width:100%;display:flex;flex-wrap:wrap;gap:.4em;justify-content:center;align-items:center;text-align:center;padding:1em;border-radius:1em;color:#fff;background:{{ '#1e88e5' if hc else '#e53935' }}">
  <div style="flex:1 1 100%;font-size:clamp(1.3rem,5vw,2rem);font-weight:700;line-height:1.2">{{ '🌙' if hc else '⚡' }} {{ 'Heure Creuse' if hc else 'Heure Pleine' }}</div>
  <div style="flex:1 1 100%;font-size:clamp(1.1rem,4vw,1.5rem)">{{ ('%.4f' | format(prix)) | replace('.', ',') }} €/kWh</div>
  <div style="flex:1 1 100%;font-size:clamp(.8rem,3vw,1rem);opacity:.9">{{ prochaine }} à {{ heure }} · dans {{ (reste // 60) ~ ' h ' ~ ('%02d' | format(reste % 60)) if reste >= 60 else reste ~ ' min' }}</div>
  {% if saison in ['Été', 'Hiver'] %}<div style="font-size:clamp(.75rem,2.8vw,.95rem);background:rgba(255,255,255,.22);padding:.15em .8em;border-radius:2em">{{ '☀️' if saison == 'Été' else '❄️' }} Mode {{ saison }}</div>{% endif %}
  </div>
