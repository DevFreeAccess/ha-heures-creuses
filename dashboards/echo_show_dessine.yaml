# Tableau de bord pour Echo Show sous TECHO5 en mode « Dessiné sur l'appareil » (Drawn)
# N'utilise que des cartes que ce mode sait dessiner : heading, conditional, tile, grid.
# À coller dans : Paramètres → Tableaux de bord → Nouveau tableau de bord → ⋮ → Éditeur de configuration brut
# Adaptez les identifiants si vous avez renommé l'intégration.
title: Électricité
views:
  - title: Électricité
    path: electricite
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Tarif en cours
          # Heure Creuse (bleu)
          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.heures_creuses_heure_creuse
                state: "on"
            card:
              type: tile
              entity: sensor.heures_creuses_prix_actuel
              name: Heure Creuse
              icon: mdi:weather-night
              color: blue
          # Heure Pleine (rouge)
          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.heures_creuses_heure_creuse
                state: "off"
            card:
              type: tile
              entity: sensor.heures_creuses_prix_actuel
              name: Heure Pleine
              icon: mdi:flash
              color: red
          - type: tile
            entity: sensor.heures_creuses_message
            name: En clair
            icon: mdi:message-text-clock
      - type: grid
        cards:
          - type: heading
            heading: Prochain changement
          - type: tile
            entity: sensor.heures_creuses_prochain_changement
            name: À
          - type: tile
            entity: sensor.heures_creuses_temps_restant
            name: Dans
          - type: tile
            entity: sensor.heures_creuses_saison
            name: Saison
